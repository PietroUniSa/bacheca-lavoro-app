name: bacheca_app
description: App Flutter della bacheca annunci di lavoro (progetto universitario).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.47.7 <3.48.0"

# Dipendenze ammesse: specs/05-architecture.md. Questo file va creato PRIMA di
# `flutter create .`, che non lo sovrascrive. Poi: `flutter pub get`.
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  go_router: ^14.2.7
  http: ^1.2.2
  intl: ^0.19.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
